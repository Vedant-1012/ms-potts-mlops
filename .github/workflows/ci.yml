name: CI/CD – build, push, deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: ✅ Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'  # Added caching for pip

      - name: ✅ Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install dvc

      - name: ✅ Run linter and tests
        run: |
          ruff check .
          pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: ✅ Pull data with DVC
        run: |
          dvc pull
          dvc status

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # Only deploy on push to main

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: ✅ Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: ✅ Set GCP project
        run: gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"

      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: ✅ Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: 🚀 Build & push backend image
        run: |
          # Set image tags with both latest and git SHA for versioning
          BACKEND_IMAGE_TAG=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dietitian-chatbot-nli/backend:${{ github.sha }}
          BACKEND_IMAGE_LATEST=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dietitian-chatbot-nli/backend:latest

          # Build the image
          docker buildx build --builder default --load -t $BACKEND_IMAGE_TAG -f Dockerfile.backend . || exit 1

          # Tag and push both versions
          docker tag $BACKEND_IMAGE_TAG $BACKEND_IMAGE_LATEST
          docker push $BACKEND_IMAGE_TAG || exit 1
          docker push $BACKEND_IMAGE_LATEST || exit 1

          # Save image reference for later use
          echo "BACKEND_IMAGE=$BACKEND_IMAGE_TAG" >> $GITHUB_ENV

      - name: 🚀 Build & push frontend image
        run: |
          # Set image tags with both latest and git SHA for versioning
          FRONTEND_IMAGE_TAG=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dietitian-chatbot-nli/frontend:${{ github.sha }}
          FRONTEND_IMAGE_LATEST=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dietitian-chatbot-nli/frontend:latest

          # Build the image
          docker buildx build --builder default --load -t $FRONTEND_IMAGE_TAG -f Dockerfile.frontend . || exit 1

          # Tag and push both versions
          docker tag $FRONTEND_IMAGE_TAG $FRONTEND_IMAGE_LATEST
          docker push $FRONTEND_IMAGE_TAG || exit 1
          docker push $FRONTEND_IMAGE_LATEST || exit 1

          # Save image reference for later use
          echo "FRONTEND_IMAGE=$FRONTEND_IMAGE_TAG" >> $GITHUB_ENV

      - name: 🌐 Deploy backend to Cloud Run
        run: |
          gcloud run deploy ms-potts-backend \
            --image ${{ env.BACKEND_IMAGE }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --max-instances 10 \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300

      - name: 🌐 Deploy frontend to Cloud Run
        run: |
          gcloud run deploy ms-potts-frontend \
            --image ${{ env.FRONTEND_IMAGE }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --max-instances 10 \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300

      - name: 🔍 Verify deployments
        run: |
          echo "Verifying backend deployment..."
          gcloud run services describe ms-potts-backend --platform managed --region us-central1 --format="value(status.url)"

          echo "Verifying frontend deployment..."
          gcloud run services describe ms-potts-frontend --platform managed --region us-central1 --format="value(status.url)"
