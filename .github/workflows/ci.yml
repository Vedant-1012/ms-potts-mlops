name: CI/CD – build, push, deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: ✅ Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ✅ Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install dvc

      - name: ✅ Run linter and tests
        run: |
          ruff check .
          pytest --cov=src --cov-report=term-missing

      - name: ✅ Pull data with DVC
        run: |
          dvc pull
          dvc status

  deploy:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: ✅ Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: ✅ Set GCP project
        run: gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"

      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: ✅ Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: 🚀 Build & push backend image
        run: |
          docker buildx build --load -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dietitian-chatbot-nli/backend:latest -f Dockerfile.backend .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dietitian-chatbot-nli/backend:latest

      - name: 🚀 Build & push frontend image
        run: |
          docker buildx build --load -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dietitian-chatbot-nli/frontend:latest -f Dockerfile.frontend .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dietitian-chatbot-nli/frontend:latest

      - name: 🌐 Deploy backend to Cloud Run
        run: |
          gcloud run deploy ms-potts-backend \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dietitian-chatbot-nli/backend:latest \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"

      - name: 🌐 Deploy frontend to Cloud Run
        run: |
          gcloud run deploy ms-potts-frontend \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dietitian-chatbot-nli/frontend:latest \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
