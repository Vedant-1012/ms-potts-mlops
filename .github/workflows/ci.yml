name: CI/CD – build, push, deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------- #
  # 1️⃣  CI JOB – lint, unit-tests, DVC                                           #
  # --------------------------------------------------------------------------- #
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: ✅ Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: ✅ Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install dvc

      - name: ✅ Run linter and tests
        run: |
          ruff check .
          pytest --cov=src --cov-report=term-missing

      - name: ✅ Pull data with DVC
        run: |
          dvc pull
          dvc status

  # --------------------------------------------------------------------------- #
  # 2️⃣  DEPLOY JOB – build & push images, deploy to Cloud Run                  #
  # --------------------------------------------------------------------------- #
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: ✅ Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: ✅ Configure GCP project
        run: gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"

      - name: ✅ Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # ---------- Build & push backend image --------------------------------- #
      - name: 🚀 Build & push backend image
        run: |
          # define both a SHA tag and a `latest` tag
          BACKEND_SHA_TAG="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dietitian-chatbot-nli/backend:${{ github.sha }}"
          BACKEND_LATEST="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dietitian-chatbot-nli/backend:latest"

          # build, tag, push
          docker build -t "$BACKEND_SHA_TAG" -f Dockerfile.backend .
          docker tag "$BACKEND_SHA_TAG" "$BACKEND_LATEST"
          docker push "$BACKEND_SHA_TAG"
          docker push "$BACKEND_LATEST"

          # make the SHA tag available for the deploy step
          echo "BACKEND_IMAGE=$BACKEND_SHA_TAG" >> $GITHUB_ENV

      # ---------- Build & push frontend image --------------------------------#
      - name: 🚀 Build & push frontend image
        run: |
          FRONTEND_SHA_TAG="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dietitian-chatbot-nli/frontend:${{ github.sha }}"
          FRONTEND_LATEST="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dietitian-chatbot-nli/frontend:latest"

          docker build -t "$FRONTEND_SHA_TAG" -f Dockerfile.frontend .
          docker tag "$FRONTEND_SHA_TAG" "$FRONTEND_LATEST"
          docker push "$FRONTEND_SHA_TAG"
          docker push "$FRONTEND_LATEST"

          echo "FRONTEND_IMAGE=$FRONTEND_SHA_TAG" >> $GITHUB_ENV

      # ---------- Deploy to Cloud Run --------------------------------------- #
      - name: 🌐 Deploy backend to Cloud Run
        run: |
          gcloud run deploy ms-potts-backend \
            --image "$BACKEND_IMAGE" \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"

      - name: 🌐 Deploy frontend to Cloud Run
        run: |
          gcloud run deploy ms-potts-frontend \
            --image "$FRONTEND_IMAGE" \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
